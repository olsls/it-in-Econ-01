<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Олеся Лесняк — учебный сайт</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f4ed; color: #283c32; font-family: Arial, sans-serif; }
    main { max-width: 800px; margin: 0 auto; padding: 16vh 28px 60px; }
    .label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-weight: normal; font-size: clamp(48px, 10vw, 88px); line-height: 1.05; margin: 32px 0; }
    .info { border-top: 1px solid #a7b0a1; padding-top: 24px; display: flex; flex-wrap: wrap; gap: 16px 48px; }
    p { font-size: 17px; line-height: 1.6; margin: 0; }
    footer { margin-top: 70px; color: #626d61; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="label">Личная учебная страница</p>
    <h1>Олеся<br>Лесняк</h1>
    <div class="info">
      <p>Экономический факультет<br>3 курс</p>
      <p>Учебная группа<br><strong>24.Б10-Э</strong></p>
    </div>
    <footer>Мой первый опыт создания и публикации веб-страницы.<br>Сайт подготовлен в рамках учебного задания.</footer>
  </main>
</body>
</html>
